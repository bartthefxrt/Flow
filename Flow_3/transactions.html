<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flow — Transactions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/transactions.css" />
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">F</span>
      <span>Flow</span>
    </div>
    <a class="nav-link " href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a>
    <a class="nav-link active" href="transactions.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      Transactions
    </a>
    <a class="nav-link " href="budgeting.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
      Budgeting
    </a>
    <a class="nav-link " href="goals.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      Goals
    </a>
    <a class="nav-link " href="analytics.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9"/><path d="M12 19V5"/><path d="M20 19v-7"/></svg>
      Analytics
    </a>
    <a class="nav-link " href="settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title">Transactions</h1>
        <p class="page-subtitle">Every dollar in and out, searchable and sortable.</p>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" id="add-transaction-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Transaction
        </button>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Search description or notes…" />
        </div>
        <select class="select" id="filter-type">
          <option value="all">All types</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
        <select class="select" id="filter-category">
          <option value="all">All categories</option>
        </select>
      </div>

      <div class="card table-card">
        <table>
          <thead>
            <tr>
              <th>Category</th>
              <th>Description</th>
              <th>Date</th>
              <th class="amt-col">Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Add Transaction</h3>
      <button class="btn-icon" id="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <form id="txn-form">
      <input type="hidden" id="txn-id" />
      <div class="type-toggle">
        <button type="button" class="type-btn expense active" data-type="expense">Expense</button>
        <button type="button" class="type-btn income" data-type="income">Income</button>
      </div>
      <div class="field">
        <label for="txn-amount">Amount</label>
        <input type="number" id="txn-amount" step="0.01" min="0" placeholder="0.00" required />
      </div>
      <div class="field">
        <label for="txn-description">Description</label>
        <input type="text" id="txn-description" placeholder="e.g. Trader Joe's" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="txn-category">Category</label>
          <select id="txn-category"></select>
        </div>
        <div class="field">
          <label for="txn-date">Date</label>
          <input type="date" id="txn-date" required />
        </div>
      </div>
      <div class="field">
        <label for="txn-notes">Notes</label>
        <textarea id="txn-notes" rows="2" placeholder="Optional notes…"></textarea>
      </div>
      <div class="field">
        <button type="button" class="btn btn-secondary" id="txn-ai-btn" style="width:100%; justify-content:center;">Ask AI: is this a good amount?</button>
        <p id="txn-ai-tip" style="font-size:12.5px; color:var(--text-dim); margin-top:6px;"></p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/transactions.js"></script>
</body>
</html>
