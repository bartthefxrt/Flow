      <div>
        <h1 class="page-title">Analytics</h1>
        <p class="page-subtitle">Trends, breakdowns, and the bigger picture.</p>
      </div>
    </header>

    <main class="content">
      <div class="analytics-grid">
        <div class="card span-7">
          <div class="card-header"><h3>Income vs. Expenses</h3></div>
          <div class="chart-box"><canvas id="income-expense-chart"></canvas></div>
        </div>

        <div class="card span-5">
          <div class="card-header"><h3>Category Breakdown</h3></div>
          <div class="chart-box"><canvas id="category-chart"></canvas></div>
          <div class="legend-list" id="category-legend"></div>
        </div>

        <div class="card span-12">
          <div class="card-header"><h3>Spending Trend</h3><p style="color:var(--text-dim); font-size:12px;">Last 6 months</p></div>
          <div class="chart-box tall"><canvas id="trend-chart"></canvas></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/analytics.js"></script>

</html>
