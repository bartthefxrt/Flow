<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flow — Goals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/goals.css" />
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">F</span>
      <span>Flow</span>
    </div>
    <a class="nav-link " href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a>
    <a class="nav-link " href="transactions.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      Transactions
    </a>
    <a class="nav-link " href="budgeting.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
      Budgeting
    </a>
    <a class="nav-link active" href="goals.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      Goals
    </a>
    <a class="nav-link " href="analytics.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9"/><path d="M12 19V5"/><path d="M20 19v-7"/></svg>
      Analytics
    </a>
    <a class="nav-link " href="settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title">Goals</h1>
        <p class="page-subtitle">What you're saving toward.</p>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" id="add-goal-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Goal
        </button>
      </div>
    </header>

    <main class="content">
      <div class="goals-grid" id="goals-grid"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <h3 id="modal-title">New Goal</h3>
      <button class="btn-icon" id="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <form id="goal-form">
      <input type="hidden" id="goal-id" />
      <div class="field">
        <label for="goal-name">Goal name</label>
        <input type="text" id="goal-name" placeholder="e.g. New Camera" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="goal-target">Target amount</label>
          <input type="number" id="goal-target" min="1" step="0.01" required />
        </div>
        <div class="field">
          <label for="goal-current">Currently saved</label>
          <input type="number" id="goal-current" min="0" step="0.01" required />
        </div>
      </div>
      <div class="field">
        <button type="button" class="btn btn-secondary" id="goal-suggest-btn" style="width:100%; justify-content:center;">Ask AI to suggest a target</button>
        <p id="goal-ai-tip" style="font-size:12.5px; color:var(--text-dim); margin-top:6px;"></p>
      </div>
      <div class="field">
        <label for="goal-deadline">Deadline</label>
        <input type="date" id="goal-deadline" required />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/goals.js"></script>
</body>
</html>
